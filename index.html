<style>

--red)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.small{font-size:12px;min-height:30px;padding:5px 9px}.actions{display:flex;flex-wrap:wrap;gap:8px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.card,.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.card{padding:17px}.card .value{font-size:23px;line-height:1.4;font-weight:700;margin:7px 0 2px}.panel{padding:17px;margin-bottom:14px}.panel h3{font-size:16px;margin:0 0 12px}.muted{color:var(--muted)}.tiny{font-size:11px}.stack{display:flex;flex-direction:column;gap:9px}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.quick button{text-align:left;padding:18px 14px;border:1px solid var(--line);background:white;border-radius:var(--r);font-weight:650}.quick button span{display:block;font-size:24px;margin-bottom:8px}.filter{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.input,.select,.textarea{border:1px solid #dcded8;background:#fff;border-radius:10px;padding:10px 11px;min-height:39px;width:100%;outline:0;color:var(--ink)}.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #315e5119}.textarea{min-height:76px;resize:vertical}.filter .input{width:min(300px,100%)}.filter .select{width:auto;min-width:145px}.filter label{font-size:12px;white-space:nowrap}.list{display:flex;flex-direction:column;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;gap:12px;align-items:center;min-width:0}.thumb{width:62px;height:62px;object-fit:cover;flex-shrink:0;border-radius:10px;background:#edeee9;display:grid;place-items:center;color:#a0aca4;font-size:23px}.item-body{min-width:0;flex:1}.item-title{font-weight:650;font-size:14px;overflow-wrap:anywhere;line-height:1.7}.meta{color:var(--muted);font-size:12px;line-height:1.65;overflow-wrap:anywhere}.side{text-align:right;align-self:center;flex-shrink:0}.item-buttons{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:5px;margin-top:7px}.empty{padding:40px 12px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #daddd6;border-radius:13px}.empty b{display:block;color:var(--ink);margin-bottom:6px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:13px}.info{padding:12px;background:#f3f5f0;border-radius:11px;line-height:1.75;font-size:12px;color:#56645c}.warning{padding:11px 12px;background:#fff6e8;border:1px solid #f4e2bc;border-radius:10px;color:#80602c;font-size:12px;line-height:1.7}.danger-msg{background:#fff1ef;color:#9d4645;border:1px solid #f4ddda}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{min-width:0}.field.wide{grid-column:1/-1}.field label{display:block;font-size:12px;color:#57625d;margin-bottom:6px;font-weight:550}.field .hint{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}.hr{border:0;border-top:1px solid var(--line);margin:16px 0}.modalwrap{position:fixed;inset:0;z-index:30;background:#17251bb3;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:white;border-radius:18px;width:min(680px,100%);max-height:min(92dvh,980px);display:flex;flex-direction:column;overflow:hidden}.modal-head{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.modal-head h3{font-size:17px;margin:0}.modal-body{padding:17px 18px;overflow-y:auto;overscroll-behavior:contain}.modal-foot{padding:12px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);background:white}.image-preview{width:86px;height:86px;border-radius:10px;object-fit:cover;background:#f1f1ed;border:1px solid var(--line)}.row-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.line-entry{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;background:#fcfcfa}.line-title{font-weight:650;font-size:12px;margin-bottom:9px}.check{display:inline-flex;gap:7px;align-items:center;cursor:pointer}.check input{accent-color:var(--accent)}.statline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0;font-size:13px}.statline strong{font-size:15px}.bar{height:8px;border-radius:8px;background:#e8ede8;overflow:hidden}.bar>i{display:block;background:var(--accent);height:100%}.toast{position:fixed;z-index:50;bottom:85px;left:50%;transform:translateX(-50%);padding:11px 16px;border-radius:10px;background:#243e33;color:white;box-shadow:0 9px 30px #0003;max-width:92%;text-align:center;font-size:13px}.bottom{display:none}.table-wrap{overflow-x:auto}.table{border-collapse:collapse;width:100%;font-size:12px}.table th,.table td{border-bottom:1px solid var(--line);padding:10px;text-align:left;white-space:nowrap}.table th{color:var(--muted);font-weight:600}.highlight{color:var(--accent);font-weight:700}.mark{font-size:11px;background:#f1f3ed;border-radius:6px;padding:4px 7px}.narrow{max-width:115px}.right{text-align:right}.pill-row{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.pill{border:1px solid #e0e5dc;border-radius:100px;padding:6px 10px;background:white;font-size:12px}.pill.active{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:650}.hidden{display:none!important}
@media(max-width:740px){.shell{padding:15px 12px 100px}.brand h1{font-size:17px}.nav{display:none}.bottom{display:grid;position:fixed;z-index:12;bottom:0;left:0;right:0;grid-template-columns:repeat(5,1fr);background:white;border-top:1px solid var(--line);padding:7px 5px max(7px,env(safe-area-inset-bottom));box-shadow:0 -6px 30px #00000008}.bottom button{border:0;background:none;color:#858c86;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;padding:4px 0}.bottom .active{color:var(--accent);font-weight:700}.bottom button span{font-size:21px}.cards{grid-template-columns:repeat(2,1fr);gap:9px}.card{padding:13px}.card .value{font-size:19px}.heading h2{font-size:19px}.quick button{font-size:12px;padding:13px 11px}.quick button span{font-size:20px}.cols{grid-template-columns:1fr}.filter .input{width:100%}.filter .select{flex:1;min-width:110px}.side{max-width:135px}.item{gap:9px;padding:10px}.thumb{width:53px;height:53px}.item-buttons{gap:3px}.modalwrap{padding:0;align-items:flex-end}.modal{max-height:95dvh;border-radius:18px 18px 0 0;width:100%}.modal-body{padding:14px}.modal-foot{padding:12px 14px}.form-grid{gap:10px}.row-grid{grid-template-columns:1fr 1fr}.row-grid>*:last-child:nth-child(odd){grid-column:1/-1}}@media(max-width:380px){.item{align-items:flex-start}.side{max-width:105px}.btn.small{font-size:11px;padding:4px 6px}.thumb{width:44px;height:44px}.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}}
</style></head>
<body>
<div id="app" class="shell"></div><div id="modal-root"></div><div id="toast-root"></div>
<script>
'use strict';
// 本地账本核心无网络请求；PWA shell 另行缓存。金额内部用数值，展示时保留两位小数；原始用量保持最多四位小数。
const APP_VERSION=4, DB_NAME='bead-stall-ledger-v1', STORE='app', KEY='snapshot';
const uid=()=>('i'+Date.now().toString(36)+Math.random().toString(36).slice(2,9));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const round=(v,d=4)=>Math.round((Number(v)+Number.EPSILON)*10**d)/10**d;
const n=v=>Number.isFinite(+v)?+v:0;
const money=v=>'¥'+n(v).toFixed(2);
const fmt=v=>String(round(n(v)));
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const attr=esc;
const safeImage=x=>typeof x==='string'&&/^data:image\/(jpeg|png|webp|gif|svg\+xml)[;,]/i.test(x)?x:'';
const kindName={bead:'散珠',metal:'金属配件',supply:'耗材',tool:'工具'};
const stateInit=()=>({version:APP_VERSION,materials:[],batches:[],products:[],markets:[],sales:[],adjustments:[],marketHistory:[],categoryUsage:{},settings:{laborRate:25,targetMargin:45,stallMode:'none',stallAmount:0,stallPlan:20,toolMode:'auto',toolPool:0,toolPlan:100}});
let state=stateInit(), db=null, storageMode='indexeddb';
const ui={tab:'home',materialFilter:'all',productFilter:'hand',search:'',salesFilter:'all',modal:null,images:{},blindRows:[],batchRows:[],bomRows:[]};
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
function toast(message){const el=$('#toast-root');el.innerHTML='<div class="toast">'+esc(message)+'</div>';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.innerHTML='',3500)}
async function openStore(){
 try{db=await new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
 storageMode='indexeddb';const saved=await new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readonly');const r=t.objectStore(STORE).get(KEY);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(saved)state=normalize(saved);
 }catch(e){console.warn('IndexedDB unavailable',e);db=null;try{const x=localStorage.getItem(DB_NAME);if(x)state=normalize(JSON.parse(x));localStorage.setItem(DB_NAME+'-probe','1');localStorage.removeItem(DB_NAME+'-probe');storageMode='localStorage'}catch(_){storageMode='unavailable'}}
}
function normalize(x){const base=stateInit();if(!x||typeof x!=='object')return base;for(const k of ['materials','batches','products','markets','sales','adjustments','marketHistory'])if(Array.isArray(x[k]))base[k]=x[k];base.settings={...base.settings,...(x.settings||{})};base.categoryUsage=x.categoryUsage&&typeof x.categoryUsage==='object'?x.categoryUsage:{};return base}
async function persist(){if(storageMode==='indexeddb')return new Promise((resolve,reject)=>{try{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('数据库保存失败'));tx.onabort=()=>reject(tx.error||new Error('数据库写入中断'))}catch(e){reject(e)}});if(storageMode==='localStorage'){localStorage.setItem(DB_NAME,JSON.stringify(state));return}throw Error('此浏览器无法持久化保存，请换用 Chrome/Edge 浏览器打开')}
async function commit(action,message='已保存'){const old=structuredClone(state);try{action();await persist();closeModal();render();toast(message)}catch(err){state=old;render();toast('操作未保存：'+(err.message||err));console.error(err)}}
const byId=(arr,id)=>arr.find(o=>o.id===id);

// 可搜索珠子品类：常用品类根据已保存记录的选择次数自动排到前面。
const BEAD_GROUPS={天然石:['白水晶','粉水晶','紫水晶','黄水晶','草莓晶','葡萄石','海蓝宝','碧玺','石榴石','玛瑙','玉髓','月光石','拉长石','虎眼石','绿幽灵','黑曜石','萤石','青金石','绿松石','天河石','红纹石','紫锂辉','太阳石','东陵玉','翡翠','和田玉'],木珠:['檀木','小叶紫檀','绿檀','黑檀','沉香木','黄花梨','崖柏','桃木','菩提根木珠','普通木珠'],菩提:['星月菩提','金刚菩提','凤眼菩提','菩提根','千眼菩提','莲花菩提','百香籽','橄榄核','椰蒂','椰壳']};
const SOURCE_CHOICES=['小红书','淘宝','拼多多','1688','抖音','微信','线下批发','其他'];
const GRADES=[['精品','精品 / 品相佳'],['优选','优选 / 状态好'],['普通','普通 / 一般'],['瑕疵','瑕疵 / 明显瑕疵']];
const GRADE_FACTOR={精品:1.35,优选:1,普通:.7,瑕疵:.35};
const groupOpts=[['天然石','天然石'],['木珠','木珠'],['菩提','菩提']];
function guessGroup(x){const v=String(x||'');if(v==='木珠'||/木|檀|花梨|崖柏/.test(v))return '木珠';if(v==='菩提'||/菩提|百香籽|椰蒂|椰壳|橄榄核/.test(v))return '菩提';return '天然石'}
function sortedCategories(group,value=''){const pool=[...(BEAD_GROUPS[group]||[]),...state.markets.map(x=>x.category),...state.materials.filter(x=>x.kind==='bead'&&(!x.beadGroup||x.beadGroup===group)).map(x=>x.subtype),String(value||'')].map(x=>String(x||'').trim()).filter(Boolean);return [...new Set(pool)].sort((a,b)=>(n(state.categoryUsage[b])-n(state.categoryUsage[a]))||a.localeCompare(b,'zh'))}
function beadCategoryField(name,label,value='',group='天然石'){
 const listId='beadlist-'+name+'-'+Math.random().toString(36).slice(2,7);
 return `<div class="field"><label>${esc(label)}</label><input class="input" name="${attr(name)}" type="search" list="${listId}" value="${attr(value)}" placeholder="输入搜索或从下拉选品类" autocomplete="off"><datalist id="${listId}">${sortedCategories(group,value).map(x=>`<option value="${attr(x)}"></option>`).join('')}</datalist><div class="hint">可搜索，也可新增品类；常用品类优先展示</div></div>`
}
function sourceField(name='source',value=''){
 return `<div class="field"><label>购买渠道</label><input class="input" name="${attr(name)}" list="source-options" value="${attr(value)}" placeholder="选小红书 / 淘宝 / 拼多多 / 1688" autocomplete="off"><datalist id="source-options">${SOURCE_CHOICES.map(x=>`<option value="${attr(x)}"></option>`).join('')}</datalist></div>`
}
function usageAdd(rows){for(const r of rows){const c=String(r.subtype||'').trim();if(c)state.categoryUsage[c]=n(state.categoryUsage[c])+1}}
function gradeFromText(v){
 const x=String(v||'').trim();
 if(/精品|完美|极佳|^A\+$/.test(x))return '精品';
 if(/明显(棉|裂|瑕疵)|大裂|贯穿裂|裂纹严重|破损|磕碰|崩口|掉角|缺口|严重瑕疵/.test(x))return '瑕疵';
 if(/微棉|微裂|细裂|微瑕|孔边微黑|单面光|稍有棉/.test(x))return '普通';
 if(/优选|良好|体透|通透|无棉|无裂|完好|^A$/.test(x))return '优选';
 if(/有裂|裂纹|瑕疵|有棉/.test(x))return '瑕疵';
 return '普通';
}
function parsePriceRange(text){const nums=String(text||'').replace(/,/g,'').match(/\d+(?:\.\d+)?/g)||[];if(!nums.length)return null;const a=Number(nums[0]),b=nums[1]===undefined?a:Number(nums[1]);if(!Number.isFinite(a)||!Number.isFinite(b)||a<0||b<0)return null;return [Math.min(a,b),Math.max(a,b)]}
function beadMarketBand(m){const mk=state.markets.find(x=>x.category.trim().toLowerCase()===String(m.subtype||'').trim().toLowerCase());const oldDate=String(m.purchaseDate||m.createdAt||'').slice(0,10),newDate=String(mk?.updatedAt||'').slice(0,10);if(mk&&newDate&&(!oldDate||newDate>=oldDate)&&Number(mk.gramPrice)>0)return null;const range=parsePriceRange(m.wholesaleRange);if(!range)return null;const factor=GRADE_FACTOR[m.grade||gradeFromText(m.flaw)]??1;return range.map(x=>round(x*factor,4))}
function marketReference(m){const band=beadMarketBand(m);if(band)return (band[0]+band[1])/2;const mk=state.markets.find(x=>x.category.trim().toLowerCase()===String(m.subtype||'').trim().toLowerCase());const grade=m.grade||gradeFromText(m.flaw);const base=n(m.marketGram)||n(mk?.gramPrice);if(!base)return 0;if(m.marketGram)return base;const specific=mk?.gradePrices?.[grade];return n(specific)||round(base*(GRADE_FACTOR[grade]??1),4)}
function marketEstimate(m){return round(n(m.weight)*marketReference(m),2)}
function marketPreview(root){
 const info=root.querySelector('[data-market-estimate]');if(!info)return;
 const blind=root.hasAttribute('data-blind-row');
 const m={subtype:v(root,blind?'b-subtype':'subtype'),weight:nv(root,blind?'b-weight':'weight'),grade:v(root,blind?'b-grade':'grade'),flaw:v(root,blind?'b-flaw':'flaw'),wholesaleRange:v(root,blind?'b-market-range':'wholesaleRange')};
 const band=beadMarketBand(m);
 if(band){info.innerHTML=m.weight>0
  ?'按品相（'+esc(m.grade)+'）调整后参考克价 '+money(band[0])+'–'+money(band[1])+'/g × '+fmt(m.weight)+'g = <b>'+money(band[0]*m.weight)+'–'+money(band[1]*m.weight)+'</b>（批发材料估值范围，非售价）'
  :'已保留批发克价 '+esc(m.wholesaleRange)+'；请填写单颗克重，系统再按品相估值。';
  return;
 }
 const ref=marketReference(m);
 info.innerHTML=ref?(m.weight>0?'参考克价 '+money(ref)+'/g × '+fmt(m.weight)+'g = <b>'+money(marketEstimate(m))+'</b>（非实际成交价）':'请填写单颗克重以计算参考估值。'):'尚无可用批发参考克价。可直接填写上面的价格区间，或到「行情」录入克价。';
}
function refreshMarketEstimates(){document.querySelectorAll('[data-market-estimate]').forEach(e=>marketPreview(e.closest('[data-blind-row]')||$('#editor')))}

const field=(name,label,value='',opts={})=>`<div class="field ${opts.wide?'wide':''}"><label>${label}${opts.required?' *':''}</label>${opts.type==='textarea'?`<textarea class="textarea" name="${name}" placeholder="${attr(opts.placeholder||'')}">${esc(value)}</textarea>`:opts.type==='select'?`<select class="select" name="${name}">${opts.options.map(([k,t])=>`<option value="${attr(k)}" ${String(k)===String(value)?'selected':''}>${esc(t)}</option>`).join('')}</select>`:`<input class="input" name="${name}" type="${opts.type||'text'}" value="${attr(value)}" ${opts.min!==undefined?'min="'+opts.min+'"':''} ${opts.step!==undefined?'step="'+opts.step+'"':''} ${opts.required?'required':''} placeholder="${attr(opts.placeholder||'')}"/>`}${opts.hint?`<div class="hint">${esc(opts.hint)}</div>`:''}</div>`;
const sel=(name,label,val,options,wide=false)=>field(name,label,val,{type:'select',options,wide});
const num=(name,label,val,extra={})=>field(name,label,val,{type:'number',min:extra.min??0,step:extra.step??'any',...extra});
const inputVal=(root,name)=>root.querySelector('[name="'+name+'"]')?.value??'';
const v=(root,name)=>inputVal(root,name).trim();
const nv=(root,name)=>n(inputVal(root,name));
const required=(cond,message)=>{if(!cond)throw Error(message)};
const imageField=(key='main',label='物料图片')=>`<div class="field wide"><label>${esc(label)}（自动压缩，保存在本地）</label><div class="flex"><img data-preview="${attr(key)}" class="image-preview" alt="图片预览" src="${safeImage(ui.images[key])||svgThumb('图')}"><div class="grow"><input class="input" style="max-width:280px" type="file" accept="image/*" data-image="${attr(key)}"><div class="hint">建议单张图片小于 10MB；删除图片可点击下方按钮。</div><button class="btn small" type="button" data-action="clear-image" data-key="${attr(key)}">清除图片</button></div></div></div>`;
function svgThumb(label){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90"><rect width="90" height="90" rx="13" fill="#eff0eb"/><text x="45" y="52" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#a1aaa3">${label}</text></svg>`)}
const imgTag=(url,label='物')=>`<img class="thumb" alt="${esc(label)}" src="${safeImage(url)||svgThumb('◇')}" loading="lazy">`;
function marketFor(m){return state.markets.find(x=>x.category.trim().toLowerCase()===String(m.subtype||'').trim().toLowerCase())}
function beadSignal(m){if(m.kind!=='bead'||m.isWelfare)return '';const reference=marketReference(m);if(!n(m.weight)||!reference)return '';const actual=n(m.unitCost)/n(m.weight);return actual>reference?`<span class="badge bad">进货克价高于参考 ${round((actual/reference-1)*100,1)}%</span>`:`<span class="badge good">克价低于参考</span>`}
const materialMeta=m=>{
 const stock=`余 ${fmt(m.qty)} ${m.unit||'个'}`;
 if(m.kind==='bead')return `${esc(m.beadGroup||guessGroup(m.subtype))} / ${esc(m.subtype||'未分类')} · ${esc(m.spec||'未填规格')} · ${n(m.weight)?fmt(m.weight)+'g · ':''}${stock} · 单颗成本 ${money(m.unitCost)}${marketEstimate(m)?' · 按品相估值 '+money(marketEstimate(m)):''}${m.wholesaleRange?' · 批发 '+esc(m.wholesaleRange):''}${m.stallRange?' · 摆摊建议 '+esc(m.stallRange):''}${m.onlineRange?' · 线上参考 '+esc(m.onlineRange):''}${m.isWelfare?' · 福利珠成本0':''}`;
 if(m.kind==='tool')return `${stock} · 购入 ${money(m.totalPrice)} · 折旧 ${fmt(m.amortUsed||0)}/${fmt(m.amortPieces||0)} 件`;
 return `${stock} · 单位成本 ${money(m.unitCost)} · ${esc(m.source||'渠道未填')}`;
};
function getOverheads(count,previous=null,toolIds=null){const s=state.settings;const qty=Math.max(1,n(count));let stallUnit=0,toolUnit=0,toolAlloc=[];const stallMode=s.stallMode;
 if(stallMode==='per')stallUnit=n(s.stallAmount);
 if(stallMode==='pool')stallUnit=n(s.stallAmount)/Math.max(1,n(s.stallPlan));
 if(s.toolMode==='manual')toolUnit=n(s.toolPool)/Math.max(1,n(s.toolPlan));
 if(s.toolMode==='auto')for(const t of state.materials.filter(x=>x.kind==='tool'&&n(x.amortPieces)>0&&(toolIds===null||toolIds.includes(x.id)))){
  const already=n(t.amortUsed)-(previous?.toolAlloc||[]).filter(a=>a.id===t.id).reduce((sum,a)=>sum+n(a.used),0);
  const taken=Math.min(qty,Math.max(0,n(t.amortPieces)-already));if(taken>0){const cost=round(taken*n(t.totalPrice)/n(t.amortPieces),6);toolAlloc.push({id:t.id,used:taken,cost});toolUnit+=cost/qty}
 }
 return {stallUnit,toolUnit,toolAlloc};
}
function calcProduct(components,count,laborMode,laborFixed,hours,previous=null,toolIds=null){const qty=Math.max(1,n(count));let material=0;for(const c of components){const m=byId(state.materials,c.id);required(m,'配方中有已不存在的物料');required(m.kind!=='tool','工具请通过折旧分摊，不作为直接耗材');material+=n(c.qty)*n(m.unitCost)}const labor=laborMode==='hour'?n(hours)*n(state.settings.laborRate):n(laborFixed);const alloc=getOverheads(qty,previous,toolIds);const unit=round(material+labor+alloc.stallUnit+alloc.toolUnit,6);return {material:round(material,6),labor:round(labor,6),stall:round(alloc.stallUnit,6),tool:round(alloc.toolUnit,6),unit,toolAlloc:alloc.toolAlloc,settingsSnapshot:{...state.settings}}}
function inventoryCheck(components,qty,prior=null){const diffs=new Map();for(const c of components)diffs.set(c.id,(diffs.get(c.id)||0)+n(c.qty)*qty);if(prior)for(const c of prior.components)diffs.set(c.id,(diffs.get(c.id)||0)-n(c.qty)*n(prior.producedQty));for(const [id,delta] of diffs){const m=byId(state.materials,id);required(m,'配方物料不存在');if(delta>0)required(n(m.qty)+0.0000001>=delta,`「${m.name}」库存不足：需要 ${fmt(delta)} ${m.unit}，当前 ${fmt(m.qty)} ${m.unit}`)}return diffs}
function adjustMaterial(diffs){for(const [id,delta] of diffs){const m=byId(state.materials,id);m.qty=round(n(m.qty)-delta,6)}}
function adjustTools(oldProduct,newCost){for(const a of oldProduct?.cost?.toolAlloc||[]){const t=byId(state.materials,a.id);if(t)t.amortUsed=round(Math.max(0,n(t.amortUsed)-n(a.used)))}for(const a of newCost?.toolAlloc||[]){const t=byId(state.materials,a.id);required(t,'折旧工具不存在');t.amortUsed=round(n(t.amortUsed)+n(a.used))}}
function cards(){const mats=state.materials.filter(m=>m.kind!=='tool').length;const hand=state.products.filter(p=>p.type==='hand').reduce((s,p)=>s+n(p.stock),0);const out=state.products.filter(p=>p.type==='out').reduce((s,p)=>s+n(p.stock),0);const revenue=state.sales.reduce((s,x)=>s+n(x.price)*n(x.qty),0);const gain=state.sales.reduce((s,x)=>s+(n(x.price)-n(x.cost))*n(x.qty),0);return `<div class="cards"><div class="card"><div class="muted tiny">物料条目</div><div class="value">${mats}</div><div class="muted tiny">不含工具</div></div><div class="card"><div class="muted tiny">手作现货</div><div class="value">${fmt(hand)} 件</div><div class="muted tiny">优先展示</div></div><div class="card"><div class="muted tiny">外购现货</div><div class="value">${fmt(out)} 件</div><div class="muted tiny">明确标注非手作</div></div><div class="card"><div class="muted tiny">销售额 / 预计收益</div><div class="value" style="font-size:17px">${money(revenue)}</div><div class="muted tiny">扣含手工费成本后 ${money(gain)}</div></div></div>`}
function tabHome(){const ext=state.sales.filter(s=>s.type==='out').reduce((a,x)=>a+n(x.price)*n(x.qty),0);const all=state.sales.reduce((a,x)=>a+n(x.price)*n(x.qty),0);const low=state.materials.filter(m=>m.kind!=='tool'&&n(m.qty)<=2);const alerts=state.materials.filter(m=>m.kind==='bead'&&beadSignal(m).includes('bad'));return `<div class="heading"><div><h2>今天也来整理小饰品 ✨</h2><p>所有数据只存在这台设备的当前浏览器里，无须联网或登录。</p></div></div>${cards()}<div class="quick" style="margin-bottom:18px"><button data-action="new-blind"><span>📿</span>录入散珠盲盒</button><button data-action="new-product-hand"><span>🧵</span>制作手作成品</button><button data-action="new-sale"><span>🧾</span>记一笔售出</button></div><div class="cols"><div class="panel"><h3>经营提醒</h3><div class="stack"><div class="statline"><span>进货克价预警</span><strong>${alerts.length} 条</strong></div><div class="statline"><span>低库存物料（≤2单位）</span><strong>${low.length} 条</strong></div><div class="statline"><span>外购成品销售额占比</span><strong>${all?round(ext/all*100,1):0}%</strong></div><div class="bar"><i style="width:${all?Math.min(100,ext/all*100):0}%"></i></div><p class="sub">逐渐增加手作占比时，可用这个指标观察实际成交结构。它按销售额统计，不等于库存占比。</p></div></div><div class="panel"><h3>第一次使用建议</h3><div class="stack"><p class="sub">① 先录入散珠、金属配件和耗材；② 在「设置」填写你的手工时薪与摊位分摊；③ 进入「成品」绑定配方、查看成本并定价；④ 售出后在「账本」记一笔。</p><div class="warning">重要：清理浏览器站点数据、更换设备或使用无痕窗口可能丢账。建议每次摆摊结束后到「设置」导出完整 JSON 备份（包含图片）。</div><button class="btn light" data-action="go-settings">去设置 / 备份 →</button></div></div></div>`}
function tabMaterials(){const f=ui.materialFilter;let arr=state.materials.filter(m=>f==='all'||m.kind===f||(f==='welfare'&&m.isWelfare));if(ui.search)arr=arr.filter(m=>(m.name+' '+m.subtype+' '+m.spec+' '+m.source+' '+m.notes).toLowerCase().includes(ui.search.toLowerCase()));arr.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));return `<div class="heading"><div><h2>物料进货与库存</h2><p>同款不同进货价建议分开记一批，避免旧成本被新价格覆盖。</p></div><div class="actions"><button class="btn primary" data-action="new-material">＋ 新增物料</button><button class="btn" data-action="new-blind">＋ 盲盒</button></div></div><div class="filter"><input class="input" id="search" placeholder="查找名称、规格、渠道…" value="${attr(ui.search)}"/><select id="material-filter" class="select"><option value="all" ${f==='all'?'selected':''}>全部物料</option>${Object.entries(kindName).map(([k,t])=>`<option value="${k}" ${f===k?'selected':''}>${t}</option>`).join('')}<option value="welfare" ${f==='welfare'?'selected':''}>仅福利珠</option></select><button class="btn" data-action="new-batch">批量录入</button></div>${state.batches.length?`<details class="panel" style="padding:12px"><summary>查看盲盒整单图片（${state.batches.length}批）</summary><div class="list" style="margin-top:10px">${[...state.batches].reverse().map(b=>`<div class="item">${imgTag(b.image,'整盒')}<div class="item-body"><b>${esc(b.title)}</b><div class="meta">${money(b.totalCost)} · ${b.totalQty}颗 · 优选${b.premiumQty} / 福利${b.welfareQty} · ${esc(b.source||'渠道未记')}</div></div></div>`).join('')}</div></details>`:''}${arr.length?`<div class="list">${arr.map(m=>`<div class="item">${imgTag(m.image)}<div class="item-body"><div class="item-title">${esc(m.name)} ${m.isWelfare?'<span class="badge">福利珠 · 0元成本</span>':''} ${m.kind==='tool'?'<span class="badge">折旧工具</span>':''}</div><div class="meta">${materialMeta(m)}</div><div class="meta">${esc(m.notes||'')}${m.kind==='bead'&&m.flaw?' · 品相：'+esc(m.flaw):''}</div>${beadSignal(m)}</div><div class="side"><div class="muted tiny">${esc(kindName[m.kind])}</div><div class="item-buttons"><button class="btn small" data-action="edit-material" data-id="${m.id}">编辑</button><button class="btn small" data-action="adjust-stock" data-id="${m.id}">盘点</button><button class="btn small danger" data-action="delete-material" data-id="${m.id}">删除</button></div></div></div>`).join('')}</div>`:'<div class="empty"><b>暂无符合条件的物料</b>可新增散珠、金属配件、耗材或工具。</div>'}`}
function productMargin(p){const price=n(p.price),cost=n(p.cost?.unit??p.buyPrice),margin=price?(price-cost)/price*100:0;return {cost,margin,gain:price-cost}}
function tabProducts(){let items=state.products.filter(p=>ui.productFilter==='all'||(ui.productFilter==='hand'&&p.type==='hand')||(ui.productFilter==='out'&&p.type==='out'));if(ui.search)items=items.filter(p=>(p.name+' '+p.notes+' '+p.source).toLowerCase().includes(ui.search.toLowerCase()));items.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));return `<div class="heading"><div><h2>成品与定价</h2><p>手作优先展示；外购商品永久标注「外购成品，非手作」。</p></div><div class="actions"><button class="btn primary" data-action="new-product-hand">＋ 手作款</button><button class="btn" data-action="new-product-out">＋ 外购款</button></div></div><div class="filter"><input class="input" id="search" placeholder="搜索成品名称、备注…" value="${attr(ui.search)}"><div class="pill-row" style="margin:0"><button class="pill ${ui.productFilter==='hand'?'active':''}" data-action="product-filter" data-val="hand">只看手作</button><button class="pill ${ui.productFilter==='all'?'active':''}" data-action="product-filter" data-val="all">全部成品</button><button class="pill ${ui.productFilter==='out'?'active':''}" data-action="product-filter" data-val="out">只看外购</button></div></div>${items.length?`<div class="list">${items.map(p=>{const v=productMargin(p);return `<div class="item">${imgTag(p.image)}<div class="item-body"><div class="item-title">${esc(p.name)} <span class="badge ${p.type==='hand'?'hand':'out'}">${p.type==='hand'?'自制手作':'外购成品，非手作'}</span></div><div class="meta">现货 ${fmt(p.stock)} 件 / 入库 ${fmt(p.producedQty)} 件 · 售价 ${money(p.price)}</div><div class="meta">单件含手工费成本 ${money(v.cost)} · 预计收益 ${money(v.gain)} · 毛利率 ${round(v.margin,1)}%</div>${p.type==='out'&&p.sameOnline?'<span class="badge warn">网上容易搜到同款</span>':''}</div><div class="side"><div class="item-buttons"><button class="btn small" data-action="edit-product" data-id="${p.id}">编辑</button><button class="btn small primary" data-action="sale-product" data-id="${p.id}" ${n(p.stock)<=0?'disabled':''}>售出</button><button class="btn small danger" data-action="delete-product" data-id="${p.id}">删除</button></div></div></div>`}).join('')}</div>`:'<div class="empty"><b>还没有这类成品</b>先做一款手作，配好珠子与耗材，就能自动计算成本。</div>'}`}
function tabMarkets(){const list=[...state.markets].sort((a,b)=>String(a.category).localeCompare(String(b.category),'zh'));const warningCount=state.materials.filter(m=>m.kind==='bead'&&beadSignal(m).includes('bad')).length;return `<div class="heading"><div><h2>天然石行情</h2><p>手动更新市场参考克价及平台克价，不联网抓价。所有价格均为元／克。</p></div><button class="btn primary" data-action="new-market">＋ 更新行情</button></div><div class="warning" style="margin-bottom:13px">参考价格只是你录入的比较基准，不是实时市场报价。只有填写了「克重」的珠子才能计算进货克价。当前超参考克价的优选珠：${warningCount} 条。</div>${list.length?`<div class="panel table-wrap"><table class="table"><thead><tr><th>品类</th><th>优选参考克价</th><th>各品相（元/g）</th><th>平台参考克价</th><th>更新日期</th><th></th></tr></thead><tbody>${list.map(m=>`<tr><td>${esc(m.category)}</td><td>${money(m.gramPrice)}/g</td><td>${GRADES.map(([g])=>g+' '+money(n(m.gradePrices?.[g])||n(m.gramPrice)*GRADE_FACTOR[g])).join(' / ')}</td><td>${n(m.platformPrice)?money(m.platformPrice)+'/g':'—'}</td><td>${esc(m.updatedAt)} ${((Date.now()-new Date(m.updatedAt).getTime())/86400000>7)?'<span class="badge warn">超7天</span>':''}</td><td><button class="btn small" data-action="edit-market" data-id="${m.id}">修改</button><button class="btn small danger" data-action="delete-market" data-id="${m.id}">删</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>还没有录入行情</b>按石头品类填写参考克价，系统会自动匹配同品类散珠。</div>'}`}
function tabSales(){let arr=[...state.sales].filter(x=>ui.salesFilter==='all'||x.type===ui.salesFilter).sort((a,b)=>String(b.date).localeCompare(String(a.date)));const totals=state.sales.reduce((acc,s)=>{acc.turnover+=n(s.price)*n(s.qty);acc.cost+=n(s.cost)*n(s.qty);acc.payout+=n(s.labor)*n(s.qty);return acc},{turnover:0,cost:0,payout:0});return `<div class="heading"><div><h2>售出与收益</h2><p>成交价以实际卖出时记录为准，历史成本在售出时快照固定。</p></div><button class="btn primary" data-action="new-sale">＋ 记一笔售出</button></div><div class="cards" style="grid-template-columns:repeat(3,1fr)"><div class="card"><div class="tiny muted">累计成交额</div><div class="value">${money(totals.turnover)}</div></div><div class="card"><div class="tiny muted">扣成本后收益</div><div class="value">${money(totals.turnover-totals.cost)}</div></div><div class="card"><div class="tiny muted">其中预留手工费</div><div class="value">${money(totals.payout)}</div></div></div><div class="filter"><select id="sales-filter" class="select"><option value="all">全部售出</option><option value="hand" ${ui.salesFilter==='hand'?'selected':''}>只看手作</option><option value="out" ${ui.salesFilter==='out'?'selected':''}>只看外购</option></select><button class="btn" data-action="export-tsv">导出 Excel 粘贴表格</button></div>${arr.length?`<div class="list">${arr.map(s=>`<div class="item"><div class="item-body"><div class="item-title">${esc(s.name)} <span class="badge ${s.type==='hand'?'hand':'out'}">${s.type==='hand'?'自制手作':'外购成品，非手作'}</span></div><div class="meta">${esc(s.date)} · 数量 ${fmt(s.qty)} · 成交单价 ${money(s.price)} · 成本单价 ${money(s.cost)}</div><div class="meta">销售收益 ${money((n(s.price)-n(s.cost))*n(s.qty))} ${s.notes?' · '+esc(s.notes):''}</div></div><div class="side"><button class="btn small" data-action="edit-sale" data-id="${s.id}">编辑</button><button class="btn small danger" data-action="delete-sale" data-id="${s.id}">撤销</button></div></div>`).join('')}</div>`:'<div class="empty"><b>还没有销售记录</b>记下每件饰品的实际成交价，才知道真正卖出了多少。</div>'}<div class="info" style="margin-top:12px">这里的「收益」＝实收金额－已入账的单件成本（包含预留手工费、估计摊位费及折旧）；并非银行账户实际现金结余，也未另外扣除未入账交通费、支付手续费等。</div>`}
function tabSettings(){const s=state.settings;const toolTotal=state.materials.filter(m=>m.kind==='tool').reduce((a,t)=>a+n(t.totalPrice),0);return `<div class="heading"><div><h2>成本规则与数据安全</h2><p>此页调整只影响未来新建／重新核算的手作批次，已售历史账目不会自动重算。</p></div></div><div class="cols"><div class="panel"><h3>手工与定价</h3><div class="form-grid"><div class="field">${num('laborRate','手工时薪（元 / 小时）',s.laborRate)}</div><div class="field">${num('targetMargin','建议目标毛利率（%）',s.targetMargin,{min:0,step:1})}</div></div><hr class="hr"><h3>摊位费预算分摊</h3><div class="form-grid">${sel('stallMode','分摊方式',s.stallMode,[['none','不分摊'],['per','每件固定金额'],['pool','本次摊费 ÷ 预计售件数']])}${num('stallAmount','每件金额 / 本次摊位费（元）',s.stallAmount)}${num('stallPlan','预计售件数（用于平均分摊）',s.stallPlan,{min:1})}</div><div class="hint muted tiny" style="margin-top:8px">摊位费是预算值，实际卖不够预计件数时可能回收不足。固定费用按每件计入一次。</div></div><div class="panel"><h3>工具折旧</h3><div class="statline"><span>工具进货合计</span><strong>${money(toolTotal)}</strong></div><div class="form-grid">${sel('toolMode','折旧来源',s.toolMode,[['auto','自动：按工具条目分期摊销'],['manual','手动：未录入工具的独立费用池'],['none','不计工具折旧']])}${num('toolPool','手动费用池总额（元）',s.toolPool)}${num('toolPlan','手动费用池预计分摊件数',s.toolPlan,{min:1})}</div><div class="info" style="margin-top:10px">自动模式读取「工具」记录的总购入价和摊销件数；每件新手作分摊一次，并在达到总件数后停止。手动模式会替代自动工具折旧，不会两种都加上；手动预算仅供估算，不自动跟踪结清。</div><div class="actions" style="margin-top:14px"><button class="btn primary" data-action="save-settings">保存成本规则</button><button class="btn" data-action="new-tool">＋ 录入工具</button></div></div></div><div class="panel"><h3>本地数据与备份</h3><div class="statline"><span>当前保存方式</span><span class="badge ${storageMode==='unavailable'?'bad':'good'}">${storageMode==='indexeddb'?'IndexedDB 持久化':storageMode==='localStorage'?'localStorage 后备存储':'不可持久化'}</span></div><p class="sub">完整备份 JSON 包含所有账目、规则及压缩图片；Excel 粘贴表格仅供查看、计算及存档，不能用于恢复系统。操作均在本地完成。</p><div class="actions" style="margin-top:12px"><button class="btn primary" data-action="backup">↓ 导出完整备份 JSON</button><button class="btn" data-action="restore">↑ 导入备份</button><button class="btn" data-action="export-tsv">↓ 导出所有表格 TSV</button><button class="btn" data-action="copy-tsv">复制物料表格</button></div><div class="warning" style="margin-top:12px">请把 JSON 备份另存到电脑、U盘或你信任的文件夹。直接打开 HTML 文件时，不同浏览器、路径或设备可能使用不同的存储空间，不能指望自动同步。不要在无痕模式下长期记账。</div></div><div class="panel"><h3>添加到手机桌面</h3><p class="sub">部署到固定 HTTPS 网址后，手机浏览器打开一次即可添加桌面图标。安装后断网也能进入已缓存的台账；首次安装需要联网。</p><div class="actions" style="margin-top:12px"><button type="button" class="btn primary" data-pwa-install>＋ 添加到桌面</button></div><div class="info" style="margin-top:12px">iPhone：Safari 打开网址 → 分享 → 添加到主屏幕 → 作为网页 App 打开。安卓：Chrome 打开网址 → 菜单 → 安装应用 / 添加到主屏幕。这个功能需要 HTTPS 网站，不能从手机文件管理器的 HTML 预览中直接安装。</div></div><div class="panel"><h3>使用说明</h3><p class="sub">① 同一套款式不同批次应分别建立成品，避免已售商品成本被新采购价覆盖。② 已售成品配方与数量锁定，只允许调整售价等展示信息。③ 含工具折旧的配方删除后会退回未售批次的折旧额度。④ 对需要追溯的材料与成品，存在绑定关系或销售记录时禁止直接删除。</p></div>`}

function materialForm(id=null,forced='bead'){

 if(kind==='bead')body+=`${sel('beadGroup','散珠分类',m?.beadGroup||guessGroup(m?.subtype),groupOpts)}${beadCategoryField('subtype','珠子品类',m?.subtype||'',m?.beadGroup||guessGroup(m?.subtype))}${field('spec','卡数：珠子尺寸 / 规格',m?.spec||'',{placeholder:'例：8mm / 10卡'})}${num('weight','单颗克重（g；可不填）',m?.weight||'')}${sel('grade','品相档位',m?.grade||gradeFromText(m?.flaw),GRADES)}${field('flaw','具体瑕疵备注',m?.flaw||'')}${field('wholesaleRange','批发参考克价区间（元/g）',m?.wholesaleRange||'',{placeholder:'例：3.5~5元/g'})}${field('stallRange','摆摊建议售价区间（元/颗）',m?.stallRange||'',{placeholder:'例：7–9元'})}${field('onlineRange','线上零售参考区间（元/颗）',m?.onlineRange||'',{placeholder:'例：12~16元'})}${field('costHint','原表单颗成本参考',m?.costHint||'',{placeholder:'仅核对，不改变实际成本'})}<div class="field wide info" data-market-estimate></div>${num('suggestedPrice','自主定价（元，可留空）',m?.suggestedPrice||'')}`;
 if(kind==='tool')body+=`${num('qty','当前数量',m?.qty??1,{min:0})}${sel('toolUnit','工具计量单位',m?.unit||'把',[['把','把'],['件','件'],['个','个'],['套','套'],['台','台'],['张','张']])}${num('totalPrice','购入总价（元）',m?.totalPrice??0)}${num('amortPieces','预计分摊成品件数（件）',m?.amortPieces??100,{min:1})}<div class="field wide"><div class="info">已经分摊 ${fmt(m?.amortUsed||0)} 件；工具不作为配方直接耗材，以避免重复记成本。</div></div>`;
 else body+=`${num('qty',kind==='bead'?'当前颗数':'当前库存数量',m?.qty??1,{min:0})}${sel('unit','库存单位',m?.unit||(kind==='bead'?'颗':'个'),[['颗','颗'],['个','个'],['件','件'],['米','米'],['厘米','厘米'],['克','克'],['毫升','毫升'],['包','包'],['卷','卷'],['套','套']])}${sel('costMode','进价计算方式',kind==='metal'?'unit':'total',[['total','按购入总价计算'],['unit','按单颗 / 单位进价计算']])}${num('unitPrice','单颗 / 单位进价（元）',m?.unitCost??'',{step:'any',hint:'金属配件可直接填写单个进价'})}${num('totalPrice','这批实际购入总价（元）',m?round(n(m.unitCost)*n(m.initialQty??m.qty),4):'',{step:'any'})}<div class="field wide"><div class="info">根据上面的「进价计算方式」选择其中一项为准；另一项仅作参考，保存时自动核算。编辑当前库存不会改变原批初始数量。${m?.batchId?'此条来自盲盒，成本已锁定。':''}</div></div>`;
 body+=`${sourceField('source',m?.source||'')}${field('purchaseDate','进货日期',m?.purchaseDate||today(),{type:'date'})}${field('notes','自定义备注',m?.notes||'',{type:'textarea',wide:true})}`;
 body+=`</div>${imageField('main')}<div class="info" style="margin-top:10px">${kind==='bead'?'福利珠只能通过盲盒模式创建，以保留成本分摊记录。':''}补货时推荐新增一条进货记录，而不是直接覆盖旧价格。</div>`;
 openModal(m?'编辑物料':'新增物料',body,'save-material');ui.images={main:m?.image||''};ui.modal=ui.modal.replace('src="'+svgThumb('图')+'"','src="'+(safeImage(ui.images.main)||svgThumb('图'))+'"');render();refreshMarketEstimates();

function parseBlindTable(raw){
 const rows=csvLines(raw);required(rows.length>=2,'请粘贴至少一条含表头的明细');required(rows.length<=501,'一次最多识别500行');
 const normalize=x=>String(x||'').replace(/[\s（）()\/\-：:]/g,'').toLowerCase();
 const headers=rows[0].map(normalize);
 const aliases={
 name:['名称','珠子名称','物料名称','品名','商品名称','珠名'],
 beadGroup:['分类','大类','珠子分类','类别','材质分类'],

  }else{
   required(cells.length>=3,'第'+(k+1)+'行列数太少，请加上表头');

 if(type==='out'){const buyPrice=nv(root,'buyPrice');required(inputVal(root,'buyPrice')!==''&&buyPrice>=0,'请输入正确进价');required(qty>=sold,'入库总数不能少于已经卖出的数量');Object.assign(base,{buyPrice,source:v(root,'source'),sameOnline:v(root,'sameOnline')==='1',producedQty:qty,stock:qty-sold,cost:{unit:buyPrice,material:buyPrice,labor:0,stall:0,tool:0}});await commit(()=>{if(old)state.products[state.products.findIndex(x=>x.id===id)]=base;else state.products.push(base)},'外购成品已保存（非手作）');return}
 if(old&&sold>0){required(qty===n(old.producedQty),'已售手作批次不能修改生产数量');Object.assign(base,{components:old.components,laborMode:old.laborMode,laborFixed:old.laborFixed,hours:old.hours,toolIds:old.toolIds||[],producedQty:old.producedQty,stock:old.stock,cost:old.cost});await commit(()=>{state.products[state.products.findIndex(x=>x.id===id)]=base},'已售批次展示信息已更新');return}
 const components=getBom(root),laborMode=v(root,'laborMode'),laborFixed=nv(root,'laborFixed'),hours=nv(root,'hours');required(laborFixed>=0&&hours>=0,'手工费和工时不能为负');required(['fixed','hour'].includes(laborMode),'手工计费方式不正确');const diffs=inventoryCheck(components,qty,old);const cost=calcProduct(components,qty,laborMode,laborFixed,hours,old,toolChoices(root));Object.assign(base,{components,laborMode,laborFixed,hours,toolIds:toolChoices(root),producedQty:qty,stock:qty,cost});await commit(()=>{adjustTools(old,cost);adjustMaterial(diffs);if(old)state.products[state.products.findIndex(x=>x.id===id)]=base;else state.products.push(base)},'手作成品已入库，物料库存已同步扣减')
}
async function saveMarket(){const root=$('#editor'),id=v(root,'id'),category=v(root,'category'),gramPrice=nv(root,'gramPrice');required(category,'请填写行情品类');required(inputVal(root,'gramPrice')!==''&&gramPrice>0,'参考克价必须大于0');const dupe=state.markets.find(m=>m.id!==id&&m.category.trim().toLowerCase()===category.toLowerCase());required(!dupe,'该品类已有行情，可直接编辑对应记录');const gradePrices={精品:nv(root,'gradeExcellent'),优选:gramPrice,普通:nv(root,'gradeCommon'),瑕疵:nv(root,'gradeFlawed')};const data={id:id||uid(),category,gramPrice,gradePrices,platformPrice:nv(root,'platformPrice'),updatedAt:v(root,'updatedAt')||today()};await commit(()=>{if(id)state.markets[state.markets.findIndex(x=>x.id===id)]=data;else state.markets.push(data)},'行情已更新')}
async function saveSale(){const root=$('#editor'),id=v(root,'id'),old=byId(state.sales,id),pid=v(root,'productId'),qty=nv(root,'qty'),price=nv(root,'price'),p=byId(state.products,pid);required(p,'请选择成品');required(Number.isInteger(qty)&&qty>=1,'售出件数必须是正整数');required(inputVal(root,'price')!==''&&price>=0,'请输入正确成交价');const available=n(p.stock)+(old?.productId===pid?n(old.qty):0);required(qty<=available,`库存不足：现在最多可卖 ${fmt(available)} 件`);const keepSnapshot=!!old&&old.productId===pid;const sale={id:id||uid(),productId:pid,type:p.type,name:p.name,qty,price,date:v(root,'date')||today(),notes:v(root,'notes'),cost:keepSnapshot?n(old.cost):n(p.cost?.unit??p.buyPrice),labor:keepSnapshot?n(old.labor):n(p.cost?.labor),createdAt:old?.createdAt||new Date().toISOString()};await commit(()=>{if(old){const former=byId(state.products,old.productId);if(former)former.stock=round(n(former.stock)+n(old.qty));}p.stock=round(n(p.stock)-qty);if(old)state.sales[state.sales.findIndex(x=>x.id===id)]=sale;else state.sales.push(sale)},'已记售出并扣除成品库存')}
async function saveAdjust(){const root=$('#editor'),id=v(root,'id'),m=byId(state.materials,id),qq=nv(root,'newQty'),reason=v(root,'reason');required(m,'物料不存在');required(qq>=0,'库存不能小于0');required(reason,'请填写盘点原因');await commit(()=>{state.adjustments.push({id:uid(),materialId:id,name:m.name,before:n(m.qty),after:qq,reason,date:new Date().toISOString()});m.qty=qq},'库存盘点已保存')}
async function saveSettings(){const s={laborRate:nv($('#app'),'laborRate'),targetMargin:nv($('#app'),'targetMargin'),stallMode:v($('#app'),'stallMode'),stallAmount:nv($('#app'),'stallAmount'),stallPlan:nv($('#app'),'stallPlan'),toolMode:v($('#app'),'toolMode'),toolPool:nv($('#app'),'toolPool'),toolPlan:nv($('#app'),'toolPlan')};required(s.laborRate>=0,'手工时薪不能为负');required(s.targetMargin>=0&&s.targetMargin<=95,'建议毛利率请设在0%到95%');required(s.stallPlan>=1&&s.toolPlan>=1,'分摊件数必须大于0');required(s.stallAmount>=0&&s.toolPool>=0,'费用不得为负');await commit(()=>{state.settings=s},'成本规则已保存')}
function deleteMaterial(id){const m=byId(state.materials,id);if(!m)return;const refs=state.products.filter(p=>p.type==='hand'&&p.components?.some(c=>c.id===id));if(refs.length)return toast('此物料被 '+refs.length+' 个手作批次引用，不能删除；可调整库存为0');if(m.kind==='tool'&&n(m.amortUsed)>0)return toast('此工具已经参与折旧分摊，不能删除历史记录');if(!confirm('确定彻底删除物料「'+m.name+'」吗？'))return;commit(()=>{state.materials=state.materials.filter(x=>x.id!==id)},'已删除物料')}
function deleteProduct(id){const p=byId(state.products,id);if(!p)return;if(state.sales.some(s=>s.productId===id))return toast('成品有销售记录，为保护历史数据不能直接删除。可新建批次或将其库存改为0。');if(!confirm(`确定删除「${p.name}」？${p.type==='hand'?'本批制作消耗的物料将全部退回库存。':''}`))return;commit(()=>{if(p.type==='hand'){const diffs=inventoryCheck([],0,p);adjustMaterial(diffs);adjustTools(p,null)}state.products=state.products.filter(x=>x.id!==id)},'成品已删除')}
function deleteSale(id){const s=byId(state.sales,id);if(!s)return;if(!confirm(`撤销「${s.name}」这笔 ${fmt(s.qty)} 件销售吗？商品将退回库存。`))return;commit(()=>{const p=byId(state.products,s.productId);if(p)p.stock=round(n(p.stock)+n(s.qty));state.sales=state.sales.filter(x=>x.id!==id)},'销售已撤销，库存已退回')}
function deleteMarket(id){const m=byId(state.markets,id);if(!m||!confirm('删除「'+m.category+'」的行情参考吗？'))return;commit(()=>state.markets=state.markets.filter(x=>x.id!==id),'行情已删除')}
function downloadFile(text,filename,format='text/plain;charset=utf-8'){const blob=new Blob([text],{type:format}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function backup(){downloadFile(JSON.stringify({app:'饰品摆摊小账本',backupVersion:1,exportedAt:new Date().toISOString(),data:state},null,2),'饰品台账_完整备份_'+today()+'.json','application/json;charset=utf-8');toast('完整 JSON 备份已导出，建议另存一份')}
function tsvClean(x){const z=String(x??'').replace(/[\t\r\n]+/g,' ').replace(/\s+/g,' ').trim();return /^[=+@]/.test(z)||(/^-/.test(z)&&!Number.isFinite(Number(z)))?"'"+z:z}
function sheet(headers,rows){return [headers,...rows].map(row=>row.map(tsvClean).join('\t')).join('\r\n')}
function makeTsv(section='all'){
 const m=()=>sheet(['类别','名称','品类','规格/卡数','克重g','品相瑕疵','当前库存','单位','单位成本元','来源','日期','盲盒批次','福利珠','市场参考元每克','建议售价元','备注'],state.materials.map(x=>[kindName[x.kind],x.name,x.subtype,x.spec,x.weight,x.flaw,x.qty,x.unit,x.kind==='tool'?x.totalPrice:x.unitCost,x.source,x.purchaseDate,x.batchId||'',x.isWelfare?'是':'否',x.marketGram,x.suggestedPrice,x.notes]));
 const prod=()=>sheet(['类别','成品名称','入库总数量','现货数量','进价/完整单位成本元','物料成本','手工费','摊位费','工具折旧','售价元','预计单件收益','毛利率%','拿货渠道','容易找到同款','备注','配方明细'],state.products.map(x=>{const c=x.cost||{},price=n(x.price),cost=n(c.unit??x.buyPrice);return [x.type==='hand'?'自制手作':'外购成品（非手作）',x.name,x.producedQty,x.stock,cost,c.material,c.labor,c.stall,c.tool,price,round(price-cost,2),price?round((price-cost)/price*100,2):0,x.source,x.sameOnline?'是':'否',x.notes,(x.components||[]).map(y=>(byId(state.materials,y.id)?.name||'历史物料')+' x '+y.qty).join('；')] }));
 const sal=()=>sheet(['日期','类别','名称','售出数量','实际成交单价元','售出单位成本元','销售额元','扣成本后收益元','其中手工费元','备注'],state.sales.map(x=>[x.date,x.type==='hand'?'自制手作':'外购成品（非手作）',x.name,x.qty,x.price,x.cost,round(n(x.price)*n(x.qty),2),round((n(x.price)-n(x.cost))*n(x.qty),2),round(n(x.labor)*n(x.qty),2),x.notes]));
 const market=()=>sheet(['品类','市场参考克价元每克','平台克价元每克','更新日期'],state.markets.map(x=>[x.category,x.gramPrice,x.platformPrice,x.updatedAt]));
 const blind=()=>sheet(['盲盒名称','整盒总价元','总颗数','优选珠颗数','福利珠颗数','购买渠道','日期','备注'],state.batches.map(x=>[x.title,x.totalCost,x.totalQty,x.premiumQty,x.welfareQty,x.source,x.date,x.notes]));
 const adjustment=()=>sheet(['盘点时间','物料名称','调整前数量','调整后数量','原因'],state.adjustments.map(x=>[x.date,x.name,x.before,x.after,x.reason]));
 if(section==='materials')return m();return [['物料',m()],['成品',prod()],['售出',sal()],['天然石行情',market()],['盲盒批次',blind()],['盘点记录',adjustment()]].map(([name,s])=>'【'+name+'】\r\n'+s).join('\r\n\r\n')
}
function exportTsv(){downloadFile('\ufeff'+makeTsv(),'饰品台账_表格_'+today()+'.tsv','text/tab-separated-values;charset=utf-8');toast('TSV 表格已导出，可用 Excel 打开')}
async function copyTsv(){const val=makeTsv('materials');try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(val)}else throw Error('使用后备复制');toast('物料表格已复制，可直接粘贴到 Excel')}catch(e){const ta=document.createElement('textarea');ta.value=val;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();const success=document.execCommand('copy');ta.remove();toast(success?'物料表格已复制':'复制被浏览器限制，请使用 TSV 导出')}}
function restoreForm(){const body=`<div class="warning">恢复备份会<b>完整替换</b>当前所有物料、成品、行情、销售和设置。为避免覆盖错误，请先导出现在的 JSON 备份。</div><div class="field" style="margin-top:14px"><label>选择以前导出的完整 JSON 文件</label><input id="restore-file" class="input" type="file" accept=".json,application/json"></div><div class="info" style="margin-top:12px">只接受本工具导出的完整备份格式；表格 TSV 不能用于恢复。</div>`;openModal('导入并恢复本地账本',body,'save-restore','校验并替换全部数据')}
async function restoreBackup(){const input=$('#restore-file'),file=input?.files?.[0];required(file,'请先选择备份文件');required(file.size<100*1024*1024,'备份文件超过 100MB，请检查');const txt=await file.text();let obj;try{obj=JSON.parse(txt)}catch(e){throw Error('文件不是有效的 JSON')};required(obj?.app==='饰品摆摊小账本'&&obj?.backupVersion===1,'文件不是本工具可识别的完整备份');for(const key of ['materials','products','markets','sales','batches'])required(Array.isArray(obj.data?.[key]),`备份缺少 ${key} 数据`);const imported=normalize(obj.data);for(const p of imported.products){required(['hand','out'].includes(p.type),'备份包含未知成品类别');if(p.type==='hand')for(const c of p.components||[])required(!!byId(imported.materials,c.id),'备份的手作配方引用缺失物料')}for(const s of imported.sales)required(!!byId(imported.products,s.productId),'备份销售记录存在未找到的成品');if(!confirm('确定以备份内容完全覆盖当前本地账本？此操作不可撤销（除非你另有备份）。'))return;await commit(()=>{state=imported;ui.tab='home'},'完整备份已恢复')}
async function shrinkImage(file){required(file.type.startsWith('image/'),'请选择图片文件');required(file.size<=20*1024*1024,'单张图片不能超过20MB');const buffer=await file.arrayBuffer();const blob=new Blob([buffer],{type:file.type});let bitmap;try{bitmap=await createImageBitmap(blob)}catch(e){throw Error('图片格式不支持，请尝试 JPG/PNG/WebP')};const max=1000,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();return canvas.toDataURL('image/jpeg',0.7)}
function updatePreview(key){const el=document.querySelector('[data-preview="'+key+'"]');if(el){el.src=safeImage(ui.images[key])||svgThumb('图');el.style.display='block'}}
function handleAction(action,btn){const id=btn.dataset.id;
 switch(action){case 'go-settings':ui.tab='settings';ui.search='';render();break;
 case 'new-material':materialForm();break;case 'new-tool':materialForm(null,'tool');break;
 case 'edit-material':materialForm(id);break;case 'new-blind':blindForm();break;case 'new-batch':batchForm();break;
 case 'new-product-hand':productForm(null,'hand');break;case 'new-product-out':productForm(null,'out');break;case 'edit-product':productForm(id);break;
 case 'new-sale':saleForm();break;case 'sale-product':saleForm(null,id);break;case 'edit-sale':saleForm(id);break;
 case 'new-market':marketForm();break;case 'edit-market':marketForm(id);break;case 'adjust-stock':adjustStockForm(id);break;
 case 'close-modal':closeModal();render();break;
 case 'add-bom-row':ui.bomRows=getBomLoose();ui.bomRows.push({id:'',qty:1});$('#bom-rows').innerHTML=ui.bomRows.map((b,i)=>bomRow(b,i)).join('');previewCost();break;
 case 'remove-bom-row':ui.bomRows=getBomLoose();ui.bomRows.splice(Number(btn.dataset.index),1);$('#bom-rows').innerHTML=ui.bomRows.map((b,i)=>bomRow(b,i)).join('');previewCost();break;
 case 'add-blind-row':{const rows=collectBlindRows();rows.push({});replaceBlindRows(rows);break}
 case 'duplicate-blind-row':{const rows=collectBlindRows();rows.push({...rows.at(-1),image:''});replaceBlindRows(rows);break}
 case 'parse-blind-table':try{blindPaste()}catch(e){toast('表格识别失败：'+e.message)}break;
 case 'remove-blind-row':{const rows=collectBlindRows();if(rows.length===1){toast('至少保留一颗优选珠');break}rows.splice(Number(btn.dataset.index),1);replaceBlindRows(rows);break}
 case 'clear-image':ui.images[btn.dataset.key]='';updatePreview(btn.dataset.key);break;
 case 'save-material':saveMaterial().catch(e=>toast(e.message));break;
 case 'save-blind':saveBlind().catch(e=>toast(e.message));break;
 case 'save-batch':saveBatch().catch(e=>toast(e.message));break;
 case 'save-product':saveProduct().catch(e=>toast(e.message));break;
 case 'save-market':saveMarket().catch(e=>toast(e.message));break;
 case 'save-sale':saveSale().catch(e=>toast(e.message));break;
 case 'save-adjust':saveAdjust().catch(e=>toast(e.message));break;
 case 'save-settings':saveSettings().catch(e=>toast(e.message));break;
 case 'save-restore':restoreBackup().catch(e=>toast(e.message));break;
 case 'delete-material':deleteMaterial(id);break;case 'delete-product':deleteProduct(id);break;case 'delete-sale':deleteSale(id);break;case 'delete-market':deleteMarket(id);break;
 case 'product-filter':ui.productFilter=btn.dataset.val;render();break;
 case 'backup':backup();break;case 'restore':restoreForm();break;case 'export-tsv':exportTsv();break;case 'copy-tsv':copyTsv();break;
 default:break;
 }}
function getBomLoose(){return Array.from($$('#bom-rows [data-bom-row]')).map(r=>({id:v(r,'component'),qty:nv(r,'used')}))}
document.addEventListener('click',event=>{const tab=event.target.closest('[data-tab]');if(tab){ui.tab=tab.dataset.tab;ui.search='';render();window.scrollTo(0,0);return}const btn=event.target.closest('button[data-action]');if(btn&&!btn.disabled){event.preventDefault();try{handleAction(btn.dataset.action,btn)}catch(e){toast(e.message||String(e))}}});
document.addEventListener('change',async event=>{const el=event.target;if(el.matches('[data-image]')){const file=el.files?.[0];if(!file)return;try{ui.images[el.dataset.image]=await shrinkImage(file);updatePreview(el.dataset.image);toast('图片已压缩，保存条目时一并入库')}catch(e){toast(e.message||String(e))}return}
 if(el.id==='blind-import-file'){const file=el.files?.[0];if(!file)return;try{required(file.size<=2*1024*1024,'表格文件不能超过2MB');const t=await file.text();const box=$('#editor [name="blindTable"]');box.value=t;toast('表格文本已载入，点击「识别并填入表单」进行核对')}catch(e){toast(e.message)}return}if(el.matches('#editor [name="beadGroup"],#editor [name="b-group"]')){const root=el.closest('[data-blind-row]')||$('#editor');const cat=root.querySelector('[name="b-subtype"], [name="subtype"]');const datalist=root.querySelector('datalist');if(datalist){datalist.innerHTML=sortedCategories(el.value,cat?.value).map(x=>`<option value="${attr(x)}"></option>`).join('')}refreshMarketEstimates();return}if(el.id==='material-filter'){ui.materialFilter=el.value;render();return}if(el.id==='sales-filter'){ui.salesFilter=el.value;render();return}if(el.matches('#editor [name="kind"]')){const existing=v($('#editor'),'id');if(existing){toast('已建物料不可改变分类');materialForm(existing);return}materialForm(null,el.value);return}if(el.matches('#editor [name="productId"]')){const p=byId(state.products,el.value);const fieldEl=$('#editor [name="price"]');if(p&&fieldEl)fieldEl.value=p.price;return}
 if(el.matches('#editor input,#editor select')){previewCost();refreshMarketEstimates()}
});
document.addEventListener('input',event=>{const el=event.target;if(el.matches('#editor [name="subtype"],#editor [name="grade"],#editor [name="weight"],#editor [name="b-subtype"],#editor [name="b-grade"],#editor [name="b-weight"]'))refreshMarketEstimates();if(el.id==='search'){const start=el.selectionStart,end=el.selectionEnd;ui.search=el.value;render();const search=$('#search');if(search){search.focus();search.setSelectionRange(start,end)}return}if(el.matches('#editor input,#editor select')){previewCost();refreshMarketEstimates()}});
document.addEventListener('submit',event=>event.preventDefault());
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&ui.modal){closeModal();render()}});
(async()=>{await openStore();render();if(storageMode==='unavailable')toast('当前浏览器无法保存数据，请换用 Chrome / Edge，切勿直接记正式账')})();
</script><script defer src="./ai-assistant.js"></script><script defer src="./pwa.js"></script></body></html>
