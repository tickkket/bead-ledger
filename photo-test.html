<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>相册 / 相机打开测试 · 饰品小账本</title><style>body{font:15px/1.6 system-ui,sans-serif;background:#f7f7f3;color:#27362e;margin:0;padding:18px}.box{max-width:500px;margin:auto;background:#fff;border:1px solid #dde5df;border-radius:15px;padding:16px}h1{font-size:20px}input[type=file]{display:block!important;width:100%;min-height:52px;opacity:1!important;pointer-events:auto!important;visibility:visible!important;position:static!important;font:15px system-ui;border:1px solid #cad9ce;background:#f6faf6;border-radius:9px;padding:12px 5px;box-sizing:border-box}label{display:block;font-weight:650;margin:18px 0 6px}.meta{color:#5c6f60;font-size:12px;white-space:pre-wrap;word-break:break-all;margin-top:9px}.logs{background:#eef5ef;border-radius:10px;padding:12px;white-space:pre-wrap;font-size:13px;min-height:65px}.tip{font-size:13px;color:#637065}img{max-width:100%;max-height:210px;object-fit:contain;margin-top:12px;border-radius:10px}a{color:#315e51}</style></head><body><main class="box"><h1>相册 / 相机测试 <small style="font-size:12px">测试版本 2026-10-28-C</small></h1><p>这是独立的测试页面，不使用智能进货弹窗，也不会上传或保存你的照片。用来确认当前手机浏览器能否打开系统相册。</p><label for="gallery">① 从相册选择（直接点下方系统按钮）</label><input id="gallery" type="file" accept="image/*"><label for="camera">② 拍照（直接点下方系统按钮）</label><input id="camera" type="file" accept="image/*" capture="environment"><div id="logs" class="logs">等待点击…</div><img id="preview" alt="照片预览" style="display:none"><p class="tip">看到“检测到点击”但没有弹出选择器：浏览器收到了点击，系统文件选择器可能被当前浏览器/桌面应用限制。若独立页面能打开，而小账本不行，则是小账本页面的交互问题。</p><p><a href="./">返回饰品小账本</a></p><div id="env" class="meta"></div></main><script>(function(){const log=document.getElementById('logs'),photo=document.getElementById('preview');function say(s){log.textContent=new Date().toLocaleTimeString()+' '+s+'\\n'+log.textContent.slice(0,500)}let url='';for(const id of ['gallery','camera']){const el=document.getElementById(id);el.addEventListener('pointerdown',()=>say(id+'：检测到按下'));el.addEventListener('click',()=>say(id+'：检测到点击，等待系统选择器'));el.addEventListener('change',()=>{const file=el.files&&el.files[0];if(!file){say(id+'：没有选中图片');return;}say(id+'：选中了 '+file.name+'（'+Math.round(file.size/1024)+'KB）');if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);photo.src=url;photo.style.display='block'});el.addEventListener('cancel',()=>say(id+'：取消选择'))}document.getElementById('env').textContent='secureContext='+window.isSecureContext+'\\nstandalone='+matchMedia('(display-mode: standalone)').matches+'\\n'+navigator.userAgent})();</script></body></html>
